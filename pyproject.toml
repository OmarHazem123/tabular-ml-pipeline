[project]
name = "tabular-ml-pipeline"
version = "0.1.0"
description = "Reproducible end-to-end tabular ML pipeline (Telco churn) with a FastAPI inference service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Hazem", email = "OmarHazem123@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pydantic==2.14.4",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "typer==0.29.2",
    "uvicorn==0.54.0",
    "xgboost-cpu==3.4.1",
]

[project.scripts]
ml-pipeline = "ml_pipeline.cli:app"

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]
train = [
    "optuna==5.1.0",
]

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv]
# `train` (Optuna + SQLAlchemy/Alembic) is only needed to fit models. It is installed by
# default for development but excluded from the serving image (`--no-default-groups`).
default-groups = ["dev", "train"]

[tool.uv.build-backend]
module-name = "ml_pipeline"
module-root = "src"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["tasks.py"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "NPY",      # numpy-specific
    "PD",       # pandas-vet
    "PT",       # pytest style
    "S",        # bandit (security)
    "TID",      # tidy imports
]
ignore = [
    "N803",     # sklearn convention: `X` arguments
    "N806",     # sklearn convention: `X` locals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]           # assert is the point of tests
"tasks.py" = ["S603", "S607", "S310"]  # fixed commands; urlopen only hits http://127.0.0.1

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "tasks.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Libraries that ship without type information.
module = ["sklearn.*", "joblib.*", "shap.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default; `pytest -m network` (or `tasks.py test-network`) runs the real-data test.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
filterwarnings = ["error", "ignore::DeprecationWarning:joblib.*"]
markers = ["network: test requires internet access (deselect with -m 'not network')"]
